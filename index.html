<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨庐 · 小说创作工作台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ==================== 书库主页 ==================== -->
<div class="view-library" id="libraryView">
  <header class="lib-bar">
    <div class="lib-bar-left">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M7 3.5v17M7 3.5L18 8v13M7 20.5L18 21" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 8.5l4.5 1.8M10.5 12.5l4.5 1.8M10.5 16.5l4.5 1.8" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">墨庐</span>
      <span class="brand-sub">小说创作工作台</span>
    </div>
    <div class="lib-bar-right">
      <button class="btn" id="exportBtn" title="将整个书库导出为 JSON 备份文件">导出备份</button>
      <button class="btn" id="importBtn" title="从 JSON 备份恢复书库（会覆盖当前内容）">导入备份</button>
      <button class="btn primary" id="newBookBtn">＋ 新建作品</button>
      <button class="icon-btn" id="themeBtnHome" title="切换亮 / 暗主题">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="lib-inner">
    <div class="lib-head">
      <div>
        <div class="lib-brand">MY LIBRARY</div>
        <h1 class="lib-title">书库</h1>
        <p class="lib-sub">管理你的全部作品 · 双击书名或类型可修改</p>
      </div>
    </div>

    <div class="lib-form" id="libForm" style="display:none">
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:var(--ink-3);stroke-width:1.6;fill:none"><path d="M5 4h11a2 2 0 0 1 2 2v14l-4-3H7a2 2 0 0 1-2-2V4z"/></svg>
      <input id="newBookName" placeholder="书名，例如《我的长篇》" maxlength="20" autocomplete="off">
      <select id="newBookGenre">
        <option>长篇</option><option>中篇</option><option>短篇</option><option>系列</option>
      </select>
      <button class="btn" id="newBookOk">创建</button>
      <button class="btn" id="newBookCancel">取消</button>
    </div>

    <div class="lib-grid" id="libGrid"></div>
  </div>
</div>

<!-- ==================== 创作工作台 ==================== -->
<div class="app" id="app">

  <!-- ==================== 标题栏 ==================== -->
  <header class="titlebar">
    <div class="tb-left">
      <button class="icon-btn" id="homeBtn" title="返回书库">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
      </button>
      <button class="icon-btn" id="sidebarBtn" title="收起 / 展开侧边栏">
        <svg class="ic-side-open" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M10 4v16"/></svg>
        <svg class="ic-side-close" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/></svg>
      </button>

      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24"><path d="M7 3.5v17M7 3.5L18 8v13M7 20.5L18 21" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 8.5l4.5 1.8M10.5 12.5l4.5 1.8M10.5 16.5l4.5 1.8" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">墨庐</span>
        <span class="brand-sub">小说创作工作台</span>
      </div>
      <span class="tb-divider"></span>
      <span class="project-name" id="projectName">未命名作品</span>
      <span class="save-state" id="saveState"><span class="dot"></span>已保存 · 刚刚</span>
    </div>

    <div class="tb-right">
      <div class="searchbox" id="searchBox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索当前模块…" autocomplete="off">
      </div>

      <button class="icon-btn" id="themeBtn" title="切换亮 / 暗主题">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>

      <button class="icon-btn" id="settingsBtn" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
      </button>
    </div>
  </header>

  <!-- ==================== 工作区 ==================== -->
  <div class="workspace">

    <!-- 侧边栏（图标导航 + 模块内容，可整体收起） -->
    <div class="side-group">

      <aside class="rail" id="rail">
        <button class="rail-btn" data-module="chapters" data-label="章节" title="章节">
          <svg viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v17H7.5A2.5 2.5 0 0 0 5 21.5v-17z"/><path d="M5 19.5A2.5 2.5 0 0 1 7.5 17H19"/><path d="M9 7h6M9 10.5h6"/></svg>
        </button>
        <button class="rail-btn" data-module="outline" data-label="大纲" title="大纲">
          <svg viewBox="0 0 24 24"><path d="M3.5 6h1M3.5 12h1M3.5 18h1M8.5 6H20M8.5 12H20M8.5 18H20"/></svg>
        </button>
        <button class="rail-btn" data-module="scenes" data-label="场景" title="场景">
          <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        </button>

        <div class="rail-sep"></div>

        <button class="rail-btn" data-module="characters" data-label="人物" title="人物">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.8-3.4 3.3-5.2 6.5-5.2s5.7 1.8 6.5 5.2"/></svg>
        </button>
        <button class="rail-btn" data-module="world" data-label="世界观" title="世界观">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4M12 3.8c2.4 2.3 3.7 5 3.7 8.2s-1.3 5.9-3.7 8.2C9.6 17.9 8.3 15.2 8.3 12s1.3-5.9 3.7-8.2z"/></svg>
        </button>
        <button class="rail-btn" data-module="settings" data-label="设定" title="设定">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="7" cy="17" r="1.8"/></svg>
        </button>

        <div class="rail-sep"></div>

        <button class="rail-btn" data-module="plot" data-label="剧情" title="剧情">
          <svg viewBox="0 0 24 24"><path d="M4 18c0-8 4-12 12-12"/><path d="M13.5 4.6L16.5 6l-2 3"/><circle cx="4" cy="18" r="1.5"/></svg>
        </button>
        <button class="rail-btn" data-module="timeline" data-label="时间线" title="时间线">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
        <button class="rail-btn" data-module="library" data-label="资料库" title="资料库">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M9 12h6"/></svg>
        </button>

        <div class="rail-sep"></div>

        <button class="rail-btn" data-module="notes" data-label="笔记" title="笔记">
          <svg viewBox="0 0 24 24"><path d="M5 4h11a2 2 0 0 1 2 2v14l-4-3H7a2 2 0 0 1-2-2V4z"/><path d="M9 9.5h6M9 13h6"/></svg>
        </button>
        <button class="rail-btn" data-module="materials" data-label="素材库" title="素材库">
          <svg viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11z"/></svg>
        </button>
      </aside>

      <!-- 模块内容栏 -->
      <aside class="panel" id="modulePanel">
        <div class="panel-head">
          <h2 id="moduleTitle">章节</h2>
          <div class="head-actions">
            <button class="icon-btn sm" id="moduleVol" title="新建卷" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-11z"/><path d="M12 10.5v5M9.5 13h5"/></svg>
            </button>
            <button class="icon-btn sm" id="moduleDel" title="删除选中条目">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>
            </button>
            <button class="icon-btn sm" id="moduleAdd" title="新建条目">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-body" id="moduleBody"></div>
        <div class="panel-foot" id="panelFoot"></div>
      </aside>

    </div>

    <!-- 编辑区（内容页） -->
    <main class="editor">
      <div class="editor-toolbar">
        <span class="crumb" id="crumb"></span>
        <div class="et-actions">
          <span class="editor-words" id="editorWords">0 字</span>
          <button class="btn" id="saveBtn" title="Ctrl+S">
            <svg viewBox="0 0 24 24"><path d="M5 3.5h11l3 3v14H5z"/><path d="M8 3.5v6h8v-6M8 20.5v-7h8v7"/></svg>
            保存
          </button>
          <button class="icon-btn" id="focusBtn" title="专注模式">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button class="icon-btn active" id="inspectorBtn" title="信息面板">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </div>

      <!-- 格式工具栏（编辑页通用） -->
      <div class="fmt-bar" id="fmtBar">
        <span class="fmt-wrap">
          <button class="fmt-btn" id="fmtFont">字体</button>
        </span>
        <span class="fmt-wrap">
          <button class="fmt-btn" id="fmtSize">字号 16</button>
        </span>
        <span class="fmt-wrap">
          <button class="fmt-btn" id="fmtLineH">行距 2.0</button>
        </span>
        <span class="fmt-sep"></span>
        <button class="fmt-btn ic" id="fmtBold" title="加粗选区（无选区则全文加粗）"><b>B</b></button>
        <button class="fmt-btn ic" id="fmtItalic" title="斜体选区（无选区则全文斜体）"><i>I</i></button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" id="fmtGrid" title="网格线">网格</button>
        <button class="fmt-btn" id="fmtHr" title="在光标处插入分割线">分割线</button>
        <button class="fmt-btn" id="fmtImage" title="插入图片（也可直接粘贴截图）">图片</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" id="fmtSearch" title="在正文内搜索">搜索</button>
        <div class="fmt-searchbox" id="fmtSearchBox" style="display:none">
          <input id="fmtSearchInput" type="text" placeholder="搜索正文…" autocomplete="off">
          <span class="fmt-count" id="fmtSearchCount"></span>
        </div>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" id="fmtUndo" title="撤回 Ctrl+Z">↺</button>
        <button class="fmt-btn" id="fmtRedo" title="恢复 Ctrl+Y">↻</button>
      </div>

      <div class="editor-scroll" id="editorScroll">
        <!-- 图片工具条：点击正文图片后显示，可调整大小 / 旋转 / 移除 -->
        <div class="img-tools" id="imgTools" style="display:none">
          <button data-act="shrink" title="缩小 20px">－</button>
          <span class="img-size" id="imgSizeText"></span>
          <button data-act="grow" title="放大 20px">＋</button>
          <span class="img-sep"></span>
          <button data-act="rotate" title="旋转 90°">⟳</button>
          <span class="img-sep"></span>
          <button data-act="remove" title="移除图片">✕</button>
        </div>
        <div class="page" id="pageWrap"></div>
      </div>
    </main>

    <!-- 信息面板 -->
    <aside class="inspector" id="inspector"></aside>
  </div>

  <!-- ==================== 状态栏 ==================== -->
  <footer class="statusbar">
    <div class="sb-left">
      <span class="ok-dot"></span><span id="autoSaveText">自动保存 · 刚刚</span>
      <span class="sb-sep">｜</span><span>本地文档库</span>
      <span class="sb-sep">｜</span><span>字数统计 · 含标点</span>
    </div>
    <div class="sb-mid">
      <span class="num" id="totalWordsText">0 字</span>
      <span class="num" style="color:var(--ink-3)">全书总字数</span>
    </div>
    <div class="sb-right" id="focusHint">
      <span>专注模式 · F2</span>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<!-- 图片文件选择（「图片」按钮触发） -->
<input type="file" id="imgFileInput" accept="image/*" style="display:none">

<!-- 备份文件选择（「导入备份」按钮触发） -->
<input type="file" id="backupFileInput" accept="application/json,.json" style="display:none">

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
